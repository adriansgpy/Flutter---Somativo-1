    <meta name="description" content="Plataforma de visualização, exportação e simulação do app de Pokédex Interativa em Flutter para entrega de trabalho de faculdade." />
    <meta property="og:title" content="Pokédex Interativa Studio" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Garante suporte a setter em window.fetch caso algum script tente sobrescrever
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          var _fetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _fetch;
            },
            set: function (newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {}

      // Polyfill defensivo para padLeft caso seja chamado no navegador
      if (typeof String.prototype.padLeft === 'undefined') {
        String.prototype.padLeft = function (targetLength, padString) {
          return this.padStart(targetLength, padString || ' ');
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
